name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências Limpas (Clean Install)
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Configurar Java JDK 17 (Estável Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o Expo SDK e Gerar Pastas Nativas
        run: |
          npx expo prebuild --platform android --clean

      - name: Compilar APK com Gradle (Debug Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: spyrraw-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
