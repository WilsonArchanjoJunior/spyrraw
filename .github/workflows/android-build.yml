name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Travado na estável para garantir compatibilidade com o Gradle do Expo
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Corrigido de node-size para node-version
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Configurar Java JDK
        uses: actions/setup-java@v5 # Atualizado para v5
        with:
          distribution: 'temurin'
          java-version: '17' # Força o JDK 17 exigido pelo compilador do Android

      - name: Configurar o Expo SDK e Pré-build Nativo
        run: |
          npx expo prebuild --platform android

      - name: Compilar APK com Gradle (Debug App)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: spyrraw-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
